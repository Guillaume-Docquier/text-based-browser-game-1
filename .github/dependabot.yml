version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: /
    commit-message:
      prefix: "actions"

    schedule:
      interval: weekly
      day: wednesday

    cooldown:
      default-days: 3

    groups:
      actions:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /
    commit-message:
      prefix: "deps"

    schedule:
      interval: weekly
      day: wednesday

    cooldown:
      default-days: 3

    versioning-strategy: increase

    groups:
      production:
        dependency-type: production
        update-types:
          - patch
          - minor
      development:
        dependency-type: development
        update-types:
          - patch
          - minor
