version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message: &commit-message
      prefix: "project(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message: *commit-message

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message: *commit-message

  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
    commit-message: *commit-message

  - package-ecosystem: "npm"
    directory: "/shared/eslint"
    schedule:
      interval: "weekly"
    commit-message: *commit-message
