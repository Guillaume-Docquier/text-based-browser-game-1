name: PR Title Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: write

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate pull request title
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          REGEX='^[^:[:space:]][^:]*: [^[:space:]].*$'

          if [[ ! "$PR_TITLE" =~ $REGEX ]]; then
            echo "is_valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "is_valid=true" >> "$GITHUB_OUTPUT"

      - name: Comment on invalid title
        if: always() && steps.validate.outputs.is_valid == 'false'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-validation
          message: |
            ### ❌ The PR title is invalid ❌

            Expected format: `<scope>: <description>`

            Choose a single scope that describes the area being changed. Both the scope and description must be non-empty.

            Examples:
            - `action-costs: correct resource calculations`
            - `deps: update frontend dev dependencies`
            - `ci: typecheck the root project`

      - name: Comment on valid title
        if: steps.validate.outputs.is_valid == 'true'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: pr-title-validation
          message: |
            ### ✅ The PR title is valid ✅
