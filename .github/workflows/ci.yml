name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  code-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      pull-requests: write

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: "@Guillaume-Docquier"

      - name: Setting up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Typecheck
        run: pnpm typecheck

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Build
        run: pnpm --filter frontend build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: "the value doesn't matter during the CI build, it only needs to be present"

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Storybook build
        run: pnpm --filter frontend storybook:build

      - name: Install Playwright browser
        run: pnpm --filter frontend e2e:install

      - name: Storybook component tests
        run: pnpm --filter frontend storybook:test

      - name: Upload Storybook test failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-test-results
          path: apps/frontend/test-results/storybook/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        # Needs to be in sync with the concurrency test image in ConcurrencyTestApiServer.ts, prod and docker-compose
        image: postgres:18.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pwd
          POSTGRES_DB: cosmic-empires
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=user --dbname=cosmic-empires"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Install Playwright browser
        run: pnpm --filter frontend e2e:install

      - name: End-to-end tests
        run: pnpm --filter frontend e2e
        env:
          DATABASE_URL: "postgres://user:pwd@127.0.0.1:5432/cosmic-empires"
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-videos
          path: apps/frontend/test-results/**/*.webm
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Tests with coverage
        run: pnpm --filter backend test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-coverage
          path: apps/backend/coverage/lcov.info
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./apps/backend/coverage/lcov.info
          disable_search: true
          # Vitest already generated LCOV; skip unrelated native/Python coverage collectors.
          plugins: noop
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  shared:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setting up pnpm
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2

      - name: Typecheck
        run: pnpm --filter shared typecheck

      - name: Tests with coverage
        run: pnpm --filter shared test:coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shared-coverage
          path: packages/shared/coverage/lcov.info
          if-no-files-found: error

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          fail_ci_if_error: true
          files: ./packages/shared/coverage/lcov.info
          disable_search: true
          # Vitest already generated LCOV; skip unrelated native/Python coverage collectors.
          plugins: noop
          flags: shared
          token: ${{ secrets.CODECOV_TOKEN }}
