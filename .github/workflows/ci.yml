name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@v6.0.3

      - name: Setting up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Validate peer dependencies
        run: pnpm peers check

      - name: Install packages
        run: pnpm ci

      - name: Format
        run: pnpm format

      - name: Lint
        run: pnpm lint

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@v6.0.3

      - name: Setting up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install packages
        run: pnpm ci

      - name: Build
        run: pnpm --filter frontend build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: "the value doesn't matter during the CI build, it only needs to be present"

      - name: Typecheck
        run: pnpm --filter frontend typecheck

      - name: Storybook
        run: pnpm --filter frontend storybook:build

      - name: Tests
        run: pnpm --filter frontend test

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout ${{ github.head_ref || github.ref_name }}
        uses: actions/checkout@v6.0.3

      - name: Setting up pnpm
        uses: pnpm/action-setup@v6.0.9

      - name: Install packages
        run: pnpm ci

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Tests with coverage
        run: pnpm --filter backend test:coverage

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
