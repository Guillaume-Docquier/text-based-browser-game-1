packages:
  - backend
  - frontend

catalog:
  "@guillaume-docquier/tools-ts": ^6.4.1
  "typescript": ~7.0.2

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

allowBuilds:
  "@clerk/shared": true
  bufferutil: true
  core-js: true
  cpu-features: false
  esbuild: true
  msw: true
  protobufjs: false
  ssh2: false
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true
