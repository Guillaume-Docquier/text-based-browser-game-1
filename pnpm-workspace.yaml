packages:
  - backend
  - frontend

catalog:
  "@guillaume-docquier/tools-ts": ^8.6.1
  "typescript": ~7.0.2

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

allowBuilds:
  bufferutil: true
  core-js: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true
