packages:
  - packages/*

catalog:
  "@guillaume-docquier/tools-ts": ^10.2.0
  "@vitest/coverage-v8": ^5.1.0
  "typescript": ~7.0.2
  "uuid": ^14.0.3
  "vitest": ^5.1.0
  "zod": ^4.6.7

audit:
  ignore:
    # CONSTRAINT: Both installed picomatch versions carry local parser patches. pnpm audits the published versions. Remove this entry with the local patches when fixed releases are available.
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

overrides:
  # CONSTRAINT: Drizzle Kit's legacy loader pins esbuild below the security fix in 0.25.0.
  "@esbuild-kit/core-utils@3.3.2>esbuild": "^0.25.12"
  # CONSTRAINT: Boundaries pins 4.7.9; its patched release is still within the release-age window.
  "handlebars@4.7.9": "^4.7.10"

allowBuilds:
  bufferutil: true
  core-js: true
  cpu-features: false
  esbuild: true
  msw: false
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # CONSTRAINT: @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true

patchedDependencies:
  # CONSTRAINT: Local mitigation for GHSA-fc5q-39xc-vjpf based on micromatch/picomatch#246.
  picomatch@2.3.2: patches/picomatch@2.3.2.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
  # CONSTRAINT: Fixing a windows bug: https://github.com/railwayapp/cli/issues/1255
  railway@3.16.0: patches/railway@3.16.0.patch
