packages:
  - apps/*
  - packages/*

catalog:
  "@guillaume-docquier/tools-ts": ^10.1.7
  "@vitest/coverage-v8": ^5.0.5
  "type-fest": ^5.10.0
  "typescript": ~7.0.2
  "uuid": ^14.0.3
  "vitest": ^5.0.5
  "zod": ^4.6.7

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

overrides:
  # Drizzle Kit's legacy loader pins esbuild below the security fix in 0.25.0.
  "@esbuild-kit/core-utils@3.3.2>esbuild": "^0.25.12"
  # Boundaries pins 4.7.9; its patched release is still within the release-age window.
  "handlebars@4.7.9": "^4.7.10"

allowBuilds:
  bufferutil: true
  core-js: true
  # Optional ssh2 CPU detection only changes cipher preference; Docker tests use the supported fallback.
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true

patchedDependencies:
  # Fixing a windows bug: https://github.com/railwayapp/cli/issues/1255
  railway@3.16.0: patches/railway@3.16.0.patch
