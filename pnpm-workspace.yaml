packages:
  - apps/*
  - packages/*

catalog:
  "@guillaume-docquier/tools-ts": ^10.1.3
  "@vitest/coverage-v8": ^5.0.3
  "type-fest": ^5.10.0
  "typescript": ~7.0.2
  "uuid": ^14.0.3
  "vitest": ^5.0.3
  "zod": ^4.6.6

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

allowBuilds:
  bufferutil: true
  core-js: true
  cpu-features: true
  esbuild: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true
