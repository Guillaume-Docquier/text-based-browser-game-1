packages:
  - packages/*

catalog:
  "@guillaume-docquier/tools-ts": ^10.2.0
  "@vitest/coverage-v8": ^5.1.0
  "type-fest": ^5.10.0
  "typescript": ~7.0.2
  "uuid": ^14.0.3
  "vitest": ^5.1.0
  "zod": ^4.6.7

audit:
  ignore:
    - GHSA-fc5q-39xc-vjpf

minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"
  - "@guillaume-docquier/oxfmt"
  - "@guillaume-docquier/oxlint"
  - "@guillaume-docquier/show-me"

overrides:
  "@esbuild-kit/core-utils@3.3.2>esbuild": "^0.25.12"
  "handlebars@4.7.9": "^4.7.10"

allowBuilds:
  bufferutil: true
  core-js: true
  cpu-features: false
  esbuild: true
  protobufjs: true
  ssh2: true
  unrs-resolver: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    utf-8-validate: "6"

strictPeerDependencies: true

patchedDependencies:
  picomatch@2.3.2: patches/picomatch@2.3.2.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
  railway@3.16.0: patches/railway@3.16.0.patch
