packages:
  - backend
  - frontend

catalog:
  "@guillaume-docquier/tools-ts": ^6.1.0
  "typescript": 7.0.1-rc

minimumReleaseAgeExclude:
  - "@guillaume-docquier/tools-ts"

allowBuilds:
  "@clerk/shared": true
  bufferutil: true
  core-js: true
  esbuild: true
  msw: true
  utf-8-validate: true

peerDependencyRules:
  allowedVersions:
    # @clerk/ui ships with peer deps conflicts
    utf-8-validate: "6"

strictPeerDependencies: true
