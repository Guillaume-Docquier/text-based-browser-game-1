services:
  db:
    image: postgres:18.4
    restart: "${RESTART_POLICY:-always}"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pwd
      POSTGRES_DB: cosmic-empires
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=user --dbname=cosmic-empires"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cosmic-empires-pgdata:/var/lib/postgresql
    labels:
      dev.cleanup: "${AUTO_CLEANUP:-false}"

volumes:
  cosmic-empires-pgdata:
